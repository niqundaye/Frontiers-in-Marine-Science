name: reproduce

on:
  push:
  pull_request:

jobs:
  test-and-reproduce:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements-dev.txt
      - run: python -m pip install -e .
      - run: python scripts/reviewer_quick_check.py --skip-tests
      - run: pytest
      - run: python -m fishery_repro all
      - run: python -m fishery_repro experiment --experiment-config configs/experiments/ci_smoke.yaml
      - run: python scripts/build_implementation_bundles.py
      - run: python scripts/validate_reproducibility_package.py
      - run: python scripts/build_artifact_manifest.py
      - uses: actions/upload-artifact@v4
        with:
          name: reproduction-results
          path: |
            results/
            ARTIFACT_MANIFEST.csv
            data/public/*.csv

  container-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t fishery-artifact:0.3.0 .
      - run: docker run --rm fishery-artifact:0.3.0
