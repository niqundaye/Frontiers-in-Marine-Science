[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fishery-ia-nsga3-reproduction"
version = "0.3.0"
description = "Transparent reconstruction of Liu, Mao & Huang (2026), Frontiers in Marine Science 13:1809036"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Reproducibility package contributors"}]
dependencies = [
  "numpy==2.3.5",
  "pandas==3.0.1",
  "matplotlib==3.10.8",
  "Pillow==12.2.0",
  "scipy==1.17.1",
  "PyYAML==6.0.3",
  "pymoo==0.6.1.6",
]

[project.scripts]
fishery-repro = "fishery_repro.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
